[project]
name = "feast"
version = "0.1.0"
description = "Fusing Evidence Across Static Analysis Tools for CWE-Specific Vulnerability Detection"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "rich>=13.0",
    "huggingface-hub>=0.24",
    "gdown>=5.0",
    "datasets>=2.0",
    "matplotlib>=3.5",
    "scikit-learn>=1.7.2",
    "xgboost>=2.0",
    "shap>=0.46",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
    "iterative-stratification>=0.1.9",
    "statsmodels>=0.14",
    "pypdf>=6.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "openpyxl>=3.1",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["ingestion"]

[tool.coverage.report]
show_missing = true
